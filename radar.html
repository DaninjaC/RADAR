<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Ninja</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: #34495e; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-top: 0; }
        .btn-conectar { background-color: #e74c3c; color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .btn-conectar.conectado { background-color: #27ae60; }
        .status { text-align: center; font-size: 18px; font-weight: bold; color: #f1c40f; margin-bottom: 20px; }
        .dados-box { background-color: #16a085; padding: 15px; border-radius: 5px; font-size: 16px; line-height: 1.5; }
        .carregando-aviso { text-align: center; font-size: 12px; color: #bdc3c7; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📡 Radar Ninja</h2>
    <div id="avisoRadares" class="carregando-aviso">Baixando mapa...</div>
    <button id="btnConectar" class="btn-conectar" onclick="conectarBluetooth()">CONECTAR PLACA</button>
    <div id="statusPlaca" class="status">AGUARDANDO... 🔴</div>
    
    <div class="dados-box">
        Velocidade Atual: <span id="txtVelocidade">0</span> km/h<br>
        Radar Direto (200m): <span id="txtDistancia">--</span><br>
        Limite Base (Área): <span id="txtLimite">--</span> km/h
    </div>
</div>

<script>
    let listaRadares = [];
    let wakeLock = null;
    let bluetoothCaracteristica = null;
    let ultimoRumo = 0; 
    
    const SERVICO_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CARACTERISTICA_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    window.onload = async () => {
        try {
            const resposta = await fetch('maparadar.csv');
            const texto = await resposta.text();
            for (let linha of texto.split('\n')) {
                if (linha.trim() === '') continue;
                let partes = linha.split(',');
                if (partes.length >= 3) {
                    let vel = partes[2].includes('@') ? parseInt(partes[2].split('@')[1]) : 0;
                    listaRadares.push({ lat: parseFloat(partes[1]), lon: parseFloat(partes[0]), vel: vel });
                }
            }
            document.getElementById('avisoRadares').innerText = `✅ Prontos: ${listaRadares.length}`;
        } catch (erro) { document.getElementById('avisoRadares').innerText = `❌ Erro CSV.`; }
    };

    async function manterTelaLigada() {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
    }

    async function conectarBluetooth() {
        try {
            let device = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'Radar Ninja' }], optionalServices: [SERVICO_UUID]
            });
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService(SERVICO_UUID);
            bluetoothCaracteristica = await service.getCharacteristic(CARACTERISTICA_UUID);

            document.getElementById('btnConectar').innerText = "DESCONECTAR";
            document.getElementById('btnConectar').classList.add('conectado');
            document.getElementById('statusPlaca').innerHTML = "CONECTADO! 🟢";

            manterTelaLigada();
            iniciarGPS();
            enviarParaESP32("CONECTADO");
        } catch (error) { alert("Erro BT: " + error); }
    }

    function enviarParaESP32(comando) {
        if (bluetoothCaracteristica) {
            bluetoothCaracteristica.writeValue(new TextEncoder().encode(comando));
        }
    }

    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const p = Math.PI/180;
        const a = 0.5 - Math.cos((lat2 - lat1) * p)/2 + 
                  Math.cos(lat1 * p) * Math.cos(lat2 * p) * 
                  (1 - Math.cos((lon2 - lon1) * p))/2;
        return 12742000 * Math.asin(Math.sqrt(a)); 
    }

    function calcularAngulo(lat1, lon1, lat2, lon2) {
        let dLon = (lon2 - lon1) * Math.PI / 180;
        let y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
        let x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
        return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function iniciarGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((position) => {
                let latAtual = position.coords.latitude;
                let lonAtual = position.coords.longitude;
                let velAtual = (position.coords.speed || 0) * 3.6;
                
                if (position.coords.heading !== null && velAtual > 2) ultimoRumo = position.coords.heading;
                document.getElementById('txtVelocidade').innerText = Math.round(velAtual);

                let limiteDaArea = 0;
                let distArea = 999999;
                
                let temRadarFrente = false;
                let distRadarFrente = 999999;

                for (let radar of listaRadares) {
                    if(Math.abs(radar.lat - latAtual) < 0.02 && Math.abs(radar.lon - lonAtual) < 0.02) {
                        let distancia = calcularDistancia(latAtual, lonAtual, radar.lat, radar.lon);
                        
                        // MOTOR 1: Velocidade (A Ilusão) - Busca o limite mais próximo na área (Raio 500m)
                        if (distancia <= 500 && distancia < distArea) {
                            distArea = Math.round(distancia);
                            limiteDaArea = radar.vel;
                        }

                        // MOTOR 2: Radar Real Direcional - Só na frente (200m) ou logo atrás (20m)
                        if (distancia <= 200) {
                            let anguloRadar = calcularAngulo(latAtual, lonAtual, radar.lat, radar.lon);
                            let diferenca = Math.abs(ultimoRumo - anguloRadar);
                            if (diferenca > 180) diferenca = 360 - diferenca;

                            let naFrente = (diferenca <= 60);

                            if ((naFrente && distancia <= 200) || (!naFrente && distancia <= 20)) {
                                if (distancia < distRadarFrente) {
                                    distRadarFrente = Math.round(distancia);
                                    temRadarFrente = true;
                                }
                            }
                        }
                    }
                }

                // ATUALIZA A TELA
                document.getElementById('txtLimite').innerText = (limiteDaArea > 0) ? limiteDaArea : "--";
                document.getElementById('txtDistancia').innerText = temRadarFrente ? distRadarFrente + " m" : "--";

                // LÓGICA INDEPENDENTE DOS LEDS
                let ledR = "0"; // Radar
                let ledV = "0"; // Velocidade

                if (temRadarFrente) ledR = "1";
                if (limiteDaArea > 0 && velAtual > limiteDaArea) ledV = "1";

                enviarParaESP32(`R${ledR}_V${ledV}`);
                
            }, (erro) => { console.log(erro); }, { enableHighAccuracy: true, maximumAge: 0 });
        }
    }
</script>
</body>
</html>
