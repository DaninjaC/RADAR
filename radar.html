<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Ninja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; margin-top: 0; }
        .btn-conectar {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-conectar.conectado { background-color: #27ae60; }
        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 20px;
        }
        .dados-box {
            background-color: #16a085;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.5;
        }
        .carregando-aviso { text-align: center; font-size: 12px; color: #bdc3c7; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📡 Radar Ninja</h2>
    <div id="avisoRadares" class="carregando-aviso">Baixando mapa de radares...</div>
    
    <button id="btnConectar" class="btn-conectar" onclick="conectarBluetooth()">CONECTAR PLACA</button>
    
    <div id="statusPlaca" class="status">AGUARDANDO... 🔴</div>
    
    <div class="dados-box">
        <b>Dados do Celular:</b><br><br>
        Velocidade Atual: <span id="txtVelocidade">0</span> km/h<br>
        Radar mais próximo: <span id="txtDistancia">Procurando...</span><br>
        Limite (<span id="lblFonte">---</span>): <span id="txtLimite">--</span> km/h
    </div>
</div>

<script>
    // --- Variáveis Globais ---
    let listaRadares = [];
    let wakeLock = null;
    let bluetoothDevice = null;
    let bluetoothCaracteristica = null;
    
    // Variáveis do OpenStreetMap
    let lastOsmLat = 0;
    let lastOsmLon = 0;
    let lastOsmSpeed = 0; 
    let isFetchingOsm = false;

    // Configurações do Bluetooth (Devem bater com o código do ESP32)
    const SERVICO_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CARACTERISTICA_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    // 1. CARREGAR O CSV AO ABRIR A PÁGINA
    window.onload = async () => {
        try {
            const resposta = await fetch('maparadar.csv');
            const texto = await resposta.text();
            const linhas = texto.split('\n');
            
            for (let linha of linhas) {
                if (linha.trim() === '') continue;
                let partes = linha.split(',');
                if (partes.length >= 3) {
                    let lon = parseFloat(partes[0]);
                    let lat = parseFloat(partes[1]);
                    let vel = 0;
                    if (partes[2].includes('@')) {
                        vel = parseInt(partes[2].split('@')[1]);
                    }
                    listaRadares.push({ lat: lat, lon: lon, vel: vel });
                }
            }
            document.getElementById('avisoRadares').innerText = `✅ ${listaRadares.length} radares offline carregados!`;
        } catch (erro) {
            document.getElementById('avisoRadares').innerText = `❌ Erro ao carregar mapa de radares offline.`;
        }
    };

    // 2. FUNÇÃO WAKE LOCK (Manter tela acesa)
    async function manterTelaLigada() {
        try {
            wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
            console.log("Erro no Wake Lock", err);
        }
    }

    // 3. CONECTAR BLUETOOTH
    async function conectarBluetooth() {
        try {
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'Radar Ninja' }], 
                optionalServices: [SERVICO_UUID]
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICO_UUID);
            bluetoothCaracteristica = await service.getCharacteristic(CARACTERISTICA_UUID);

            const btn = document.getElementById('btnConectar');
            btn.innerText = "DESCONECTAR";
            btn.classList.add('conectado');
            document.getElementById('statusPlaca').innerHTML = "CONECTADO! 🟢";

            manterTelaLigada();
            iniciarGPS();
            enviarParaESP32("CONECTADO");

        } catch (error) {
            alert("Falha ao conectar: " + error);
        }
    }

    // 4. ENVIAR DADOS PARA O ESP32
    function enviarParaESP32(comando) {
        if (bluetoothCaracteristica) {
            let encoder = new TextEncoder('utf-8');
            bluetoothCaracteristica.writeValue(encoder.encode(comando)).catch(e => console.log("Erro BT", e));
        }
    }

    // 5. CÁLCULO DE DISTÂNCIA (Haversine em metros)
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const phi1 = lat1 * Math.PI/180;
        const phi2 = lat2 * Math.PI/180;
        const deltaPhi = (lat2-lat1) * Math.PI/180;
        const deltaLambda = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    // 6. CONSULTA AO OPENSTREETMAP (Silenciosa e Assíncrona)
    async function buscarVelocidadeVia(lat, lon) {
        if (isFetchingOsm) return;
        isFetchingOsm = true;
        try {
            // Pede a rua num raio de 15 metros que tenha limite de velocidade cadastrado
            let query = `[out:json];way(around:15,${lat},${lon})["maxspeed"];out tags;`;
            let url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.elements && data.elements.length > 0) {
                let speedRaw = data.elements[0].tags.maxspeed;
                let speedParsed = parseInt(speedRaw);
                if (!isNaN(speedParsed)) {
                    lastOsmSpeed = speedParsed;
                }
            } else {
                lastOsmSpeed = 0; // Rua não tem velocidade cadastrada no mapa
            }
        } catch (error) {
            console.log("Erro OSM:", error);
        } finally {
            isFetchingOsm = false;
        }
    }

    // 7. RASTREIO DE GPS (Coração Híbrido)
    function iniciarGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (position) => {
                    let latAtual = position.coords.latitude;
                    let lonAtual = position.coords.longitude;
                    let velAtual = (position.coords.speed || 0) * 3.6;
                    
                    document.getElementById('txtVelocidade').innerText = Math.round(velAtual);

                    let radarEncontrado = false;
                    let menorDistancia = 999999;
                    let velDoRadar = 0;

                    // A. PROCURA RADAR OFFLINE (Prioridade 1)
                    for (let radar of listaRadares) {
                        if(Math.abs(radar.lat - latAtual) < 0.01 && Math.abs(radar.lon - lonAtual) < 0.01) {
                            let distancia = calcularDistancia(latAtual, lonAtual, radar.lat, radar.lon);
                            if (distancia < 500 && distancia < menorDistancia) {
                                menorDistancia = Math.round(distancia);
                                velDoRadar = radar.vel;
                                radarEncontrado = true;
                            }
                        }
                    }

                    let limiteAtivo = 0;

                    // B. LÓGICA DE DECISÃO (Radar vs OSM)
                    if (radarEncontrado) {
                        limiteAtivo = velDoRadar;
                        document.getElementById('txtDistancia').innerText = menorDistancia + " m";
                        document.getElementById('lblFonte').innerText = "Radar";
                    } else {
                        document.getElementById('txtDistancia').innerText = "Nenhum no raio de 500m";
                        document.getElementById('lblFonte').innerText = "Via";
                        
                        // Verifica se andou mais de 100m para não travar a API do OpenStreetMap
                        let distOSM = calcularDistancia(latAtual, lonAtual, lastOsmLat, lastOsmLon);
                        if (distOSM > 100 || lastOsmLat === 0) {
                            lastOsmLat = latAtual;
                            lastOsmLon = lonAtual;
                            buscarVelocidadeVia(latAtual, lonAtual); 
                        }
                        limiteAtivo = lastOsmSpeed;
                    }

                    // C. ATUALIZA A TELA
                    document.getElementById('txtLimite').innerText = limiteAtivo > 0 ? limiteAtivo : "--";

                    // D. ATUALIZA OS LEDS DA PLACA
                    if (limiteAtivo > 0 && Math.round(velAtual) > limiteAtivo) {
                        enviarParaESP32("EXCESSO");
                    } else if (radarEncontrado) {
                        enviarParaESP32("RADAR");
                    } else {
                        enviarParaESP32("LIMPO");
                    }
                },
                (erro) => { console.log("Erro de GPS", erro); },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        }
    }
</script>

</body>
</html>
