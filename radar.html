<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Ninja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #34495e;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; margin-top: 0; }
        .btn-conectar {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .btn-conectar.conectado { background-color: #27ae60; }
        .status {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 20px;
        }
        .dados-box {
            background-color: #16a085;
            padding: 15px;
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.5;
        }
        .carregando-aviso { text-align: center; font-size: 12px; color: #bdc3c7; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📡 Radar Ninja</h2>
    <div id="avisoRadares" class="carregando-aviso">Baixando mapa de radares...</div>
    
    <button id="btnConectar" class="btn-conectar" onclick="conectarBluetooth()">CONECTAR PLACA</button>
    
    <div id="statusPlaca" class="status">AGUARDANDO... 🔴</div>
    
    <div class="dados-box">
        <b>Dados do Celular:</b><br><br>
        Velocidade Atual: <span id="txtVelocidade">0</span> km/h<br>
        Radar mais próximo: <span id="txtDistancia">Procurando...</span><br>
        Limite da Via: <span id="txtLimite">--</span> km/h
    </div>
</div>

<script>
    let listaRadares = [];
    let wakeLock = null;
    let bluetoothDevice = null;
    let bluetoothCaracteristica = null;
    let ultimoRumo = 0; // Guarda a direção do carro caso ele pare no semáforo
    
    const SERVICO_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
    const CARACTERISTICA_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

    // 1. CARREGAR O CSV
    window.onload = async () => {
        try {
            const resposta = await fetch('maparadar.csv');
            const texto = await resposta.text();
            const linhas = texto.split('\n');
            
            for (let linha of linhas) {
                if (linha.trim() === '') continue;
                let partes = linha.split(',');
                if (partes.length >= 3) {
                    let lon = parseFloat(partes[0]);
                    let lat = parseFloat(partes[1]);
                    let vel = 0;
                    if (partes[2].includes('@')) {
                        vel = parseInt(partes[2].split('@')[1]);
                    }
                    listaRadares.push({ lat: lat, lon: lon, vel: vel });
                }
            }
            document.getElementById('avisoRadares').innerText = `✅ ${listaRadares.length} radares na memória!`;
        } catch (erro) {
            document.getElementById('avisoRadares').innerText = `❌ Erro ao carregar radares.`;
        }
    };

    async function manterTelaLigada() {
        try { wakeLock = await navigator.wakeLock.request('screen'); } 
        catch (err) { console.log("Erro no Wake Lock", err); }
    }

    async function conectarBluetooth() {
        try {
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'Radar Ninja' }],
                optionalServices: [SERVICO_UUID]
            });

            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICO_UUID);
            bluetoothCaracteristica = await service.getCharacteristic(CARACTERISTICA_UUID);

            const btn = document.getElementById('btnConectar');
            btn.innerText = "DESCONECTAR";
            btn.classList.add('conectado');
            document.getElementById('statusPlaca').innerHTML = "CONECTADO! 🟢";

            manterTelaLigada();
            iniciarGPS();
            enviarParaESP32("CONECTADO");

        } catch (error) {
            alert("Falha ao conectar: " + error);
        }
    }

    function enviarParaESP32(comando) {
        if (bluetoothCaracteristica) {
            let encoder = new TextEncoder('utf-8');
            bluetoothCaracteristica.writeValue(encoder.encode(comando));
        }
    }

    // FÓRMULA 1: Calcula Distância em Metros
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; 
        const phi1 = lat1 * Math.PI/180;
        const phi2 = lat2 * Math.PI/180;
        const deltaPhi = (lat2-lat1) * Math.PI/180;
        const deltaLambda = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    // FÓRMULA 2: Calcula o Ângulo (Bússola) de onde está o radar
    function calcularAngulo(lat1, lon1, lat2, lon2) {
        let l1 = lat1 * Math.PI / 180;
        let l2 = lat2 * Math.PI / 180;
        let dLon = (lon2 - lon1) * Math.PI / 180;
        let y = Math.sin(dLon) * Math.cos(l2);
        let x = Math.cos(l1) * Math.sin(l2) - Math.sin(l1) * Math.cos(l2) * Math.cos(dLon);
        let angulo = Math.atan2(y, x) * 180 / Math.PI;
        return (angulo + 360) % 360;
    }

    let gpsID;
    function iniciarGPS() {
        if ("geolocation" in navigator) {
            gpsID = navigator.geolocation.watchPosition(
                (position) => {
                    let latAtual = position.coords.latitude;
                    let lonAtual = position.coords.longitude;
                    let velAtual = (position.coords.speed || 0) * 3.6;
                    
                    // Atualiza direção apenas se estiver andando (evita bugar no semáforo)
                    if (position.coords.heading !== null && velAtual > 2) {
                        ultimoRumo = position.coords.heading;
                    }

                    document.getElementById('txtVelocidade').innerText = Math.round(velAtual);

                    let radarEncontrado = false;
                    let menorDistancia = 999999;
                    let velDoRadar = 0;

                    for (let radar of listaRadares) {
                        // Filtro de "caixa" pra economizar processamento
                        if(Math.abs(radar.lat - latAtual) < 0.01 && Math.abs(radar.lon - lonAtual) < 0.01) {
                            
                            let distancia = calcularDistancia(latAtual, lonAtual, radar.lat, radar.lon);
                            
                            // Só calcula matemática pesada se estiver a menos de 100m (frente) ou 20m (trás)
                            if (distancia <= 100) {
                                let anguloRadar = calcularAngulo(latAtual, lonAtual, radar.lat, radar.lon);
                                
                                // Diferença entre o bico do carro e o radar
                                let diferenca = Math.abs(ultimoRumo - anguloRadar);
                                if (diferenca > 180) diferenca = 360 - diferenca;

                                // Está num cone de 60 graus na nossa frente?
                                let radarNaFrente = (diferenca <= 60);

                                let ativarAlerta = false;

                                // REGRA MAGNÍFICA:
                                if (radarNaFrente && distancia <= 100) {
                                    ativarAlerta = true; // Aproximando (Até 100m)
                                } else if (!radarNaFrente && distancia <= 20) {
                                    ativarAlerta = true; // Passou, mas segura por 20m
                                }

                                if (ativarAlerta && distancia < menorDistancia) {
                                    menorDistancia = Math.round(distancia);
                                    velDoRadar = radar.vel;
                                    radarEncontrado = true;
                                }
                            }
                        }
                    }

                    // COMANDOS DOS LEDS
                    if (radarEncontrado) {
                        document.getElementById('txtDistancia').innerText = menorDistancia + " m";
                        document.getElementById('txtLimite').innerText = velDoRadar;
                        
                        if (velAtual > velDoRadar) {
                            enviarParaESP32("EXCESSO"); // Acende Amarelo e Verde
                        } else {
                            enviarParaESP32("RADAR");   // Acende só o de Radar
                        }
                    } else {
                        document.getElementById('txtDistancia').innerText = "Nenhum radar na rota";
                        document.getElementById('txtLimite').innerText = "--";
                        enviarParaESP32("LIMPO");       // Apaga tudo
                    }
                },
                (erro) => { console.log("Erro de GPS", erro); },
                { enableHighAccuracy: true, maximumAge: 0 }
            );
        } else {
            alert("GPS não suportado.");
        }
    }
</script>

</body>
</html>
