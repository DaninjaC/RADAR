<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Inteligente</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background-color: #2c3e50; color: white; }
        .caixa { background-color: #34495e; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); }
        button { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.3s; width: 100%; max-width: 250px; }
        
        #btnConectar { background-color: #27ae60; color: white; }
        #btnDesconectar { background-color: #c0392b; color: white; display: none; }
        
        /* Botões de Ação novos */
        .btnAcao { background-color: #2980b9; color: white; display: none; margin-top: 20px;}
        .btnAcao:active { background-color: #1c5980; }

        #status { font-size: 20px; margin-top: 20px; color: #f1c40f; font-weight: bold;}
    </style>
</head>
<body>

    <div class="caixa">
        <h1>📡 Controle do Radar</h1>

        <button id="btnConectar">CONECTAR AO RADAR</button>
        <button id="btnDesconectar">DESCONECTAR</button>

        <div id="status">Status: Desconectado 🔴</div>

        <!-- Nossos novos botões de teste -->
        <button id="btnLigar" class="btnAcao">💡 LIGAR LEDs</button>
        <button id="btnDesligar" class="btnAcao">🌑 DESLIGAR LEDs</button>
    </div>

    <script>
        const btnConectar = document.getElementById('btnConectar');
        const btnDesconectar = document.getElementById('btnDesconectar');
        const btnLigar = document.getElementById('btnLigar');
        const btnDesligar = document.getElementById('btnDesligar');
        const statusTexto = document.getElementById('status');

        const servicoUUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const caracteristicaUUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        
        let dispositivoBluetooth;
        let caracteristicaGlobal; // Variável para segurar a rota de dados

        btnConectar.addEventListener('click', async () => {
            try {
                statusTexto.innerText = 'Status: Procurando... 🔎';
                
                dispositivoBluetooth = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Radar do Carro' }],
                    optionalServices: [servicoUUID]
                });

                dispositivoBluetooth.addEventListener('gattserverdisconnected', aoDesconectar);

                statusTexto.innerText = 'Status: Conectando... ⏳';

                const servidorGATT = await dispositivoBluetooth.gatt.connect();
                const servico = await servidorGATT.getPrimaryService(servicoUUID);
                
                // Salvamos a característica na variável global para os outros botões usarem
                caracteristicaGlobal = await servico.getCharacteristic(caracteristicaUUID);

                statusTexto.innerText = 'Status: CONECTADO! 🟢';
                btnConectar.style.display = 'none';
                btnDesconectar.style.display = 'inline-block';
                
                // Mostra os botões de ação!
                btnLigar.style.display = 'inline-block';
                btnDesligar.style.display = 'inline-block';

            } catch (erro) {
                console.error(erro);
                statusTexto.innerText = 'Status: Erro na conexão ❌';
            }
        });

        // --- FUNÇÕES DOS BOTÕES NOVOS ---
        btnLigar.addEventListener('click', async () => {
            if (caracteristicaGlobal) {
                let codificador = new TextEncoder();
                await caracteristicaGlobal.writeValue(codificador.encode("LIGAR"));
            }
        });

        btnDesligar.addEventListener('click', async () => {
            if (caracteristicaGlobal) {
                let codificador = new TextEncoder();
                await caracteristicaGlobal.writeValue(codificador.encode("DESLIGAR"));
            }
        });

        btnDesconectar.addEventListener('click', () => {
            if (dispositivoBluetooth && dispositivoBluetooth.gatt.connected) {
                dispositivoBluetooth.gatt.disconnect();
            }
        });

        function aoDesconectar() {
            statusTexto.innerText = 'Status: Desconectado 🔴';
            btnConectar.style.display = 'inline-block';
            btnDesconectar.style.display = 'none';
            btnLigar.style.display = 'none';
            btnDesligar.style.display = 'none';
        }
    </script>
</body>
</html>
